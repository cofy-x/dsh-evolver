name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated alpha tag at the synchronized main tip
        required: true
        type: string
      stage:
        description: Submit the verified archive to npm staging for human approval
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  candidate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.19.1 --ignore-scripts
      - name: Verify candidate and required CI
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module -e 'import assert from "node:assert/strict"; import p from "./package.json" with { type: "json" }; assert.equal(process.env.RELEASE_TAG, "v" + p.version)'
          node scripts/check-release.mjs
          gh run list --workflow ci.yml --branch main --commit "$(git rev-parse HEAD)" --event push --limit 1 --json conclusion --jq '.[0].conclusion' | grep -qx success
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run format:check && pnpm run lint && pnpm run typecheck && pnpm test
      - run: pnpm run test:package
      - run: node scripts/check-release.mjs --artifact
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-candidate
          path: .cache/release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Stage the verified archive, never publish directly
        if: inputs.stage
        run: |
          node scripts/check-release.mjs --artifact
          npm stage publish ".cache/release/dsh-evolver-$(node -p 'require("./package.json").version').tgz" --ignore-scripts --access public --tag alpha
